<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Convertidor de Archivos a PowerPoint</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Convertidor de Archivos a PowerPoint</h1>
    <p>Sube archivos y conviértelos a PPTX fácilmente.</p>
  </header>

  <main class="layout">
    <section class="left-panel">
      <h2>1. Subir archivos</h2>
      <input type="file" id="fileInput" multiple accept=".pdf,.txt,.jpg,.jpeg,.png,.gif,.doc,.docx" />

      <h2>2. Convertir</h2>
      <button id="convertBtn">Convertir a PPTX</button>

      <h2>3. Descargar</h2>
      <a id="downloadLink" style="display:none;" download="converted.pptx">Descargar PPTX</a>
    </section>

    <section class="canvas-panel">
      <div id="status">Selecciona archivos para convertir.</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
